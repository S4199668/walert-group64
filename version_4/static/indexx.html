<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>RAG Chatbot</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 760px;
                margin: 0 auto;
                padding: 16px;
            }
            #log {
                border: 1px solid #ccc;
                border-radius: 8px;
                height: 55vh;
                overflow-y: auto;
                padding: 10px;
            }
            .u {
                text-align: right;
                margin: 8px 0;
            }
            .u span {
                background: #dbeafe;
                padding: 6px 10px;
                border-radius: 10px;
                display: inline-block;
                white-space: pre-wrap;
            }
            .a {
                margin: 8px 0;
            }
            .a span {
                background: #f1f5f9;
                padding: 6px 10px;
                border-radius: 10px;
                display: inline-block;
                white-space: pre-wrap;
            }
            small {
                color: #666;
                display: block;
                margin-top: 2px;
            }
            .row {
                display: flex;
                gap: 8px;
                margin: 10px 0;
            }
            input[type="text"] {
                flex: 1;
                padding: 8px;
            }
            fieldset {
                margin-top: 16px;
            }
        </style>
    </head>
    <body>
        <h2>RAG Chatbot</h2>
        <div id="log"></div>
        <div class="row">
            <input
                type="text"
                id="msg"
                placeholder="Ask something..."
                autofocus
            />
            <button id="send">Send</button>
            <button id="new">New chat</button>
        </div>

        <fieldset>
            <legend>Upload new data (.txt / .pdf)</legend>
            <input type="file" id="files" multiple accept=".txt,.pdf" />
            <button id="up">Upload &amp; embed</button>
            <div id="upstatus"></div>
        </fieldset>

        <script>
            let sid = localStorage.getItem("sid") || null;
            const log = document.getElementById("log"),
                msg = document.getElementById("msg");

            function add(cls, text, note) {
                const d = document.createElement("div");
                d.className = cls;
                const s = document.createElement("span");
                s.textContent = text;
                d.appendChild(s);
                if (note) {
                    const n = document.createElement("small");
                    n.textContent = note;
                    d.appendChild(n);
                }
                log.appendChild(d);
                log.scrollTop = log.scrollHeight;
            }

            async function loadHistory() {
                if (!sid) return;
                const r = await fetch("/api/sessions/" + sid);
                if (r.ok)
                    (await r.json()).forEach((m) =>
                        add(m.role === "user" ? "u" : "a", m.content),
                    );
            }

            async function send() {
                const text = msg.value.trim();
                if (!text) return;
                msg.value = "";
                add("u", text);
                const r = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: sid }),
                });
                if (!r.ok) {
                    add("a", "Error: " + r.status);
                    return;
                }
                const d = await r.json();
                sid = d.session_id;
                localStorage.setItem("sid", sid);
                add(
                    "a",
                    d.answer,
                    d.sources.length ? "Sources: " + d.sources.join(", ") : "",
                );
            }

            document.getElementById("send").onclick = send;
            msg.onkeydown = (e) => {
                if (e.key === "Enter") send();
            };
            document.getElementById("new").onclick = () => {
                localStorage.removeItem("sid");
                sid = null;
                log.innerHTML = "";
            };

            document.getElementById("up").onclick = async () => {
                const fs = document.getElementById("files").files,
                    st = document.getElementById("upstatus");
                if (!fs.length) return;
                const fd = new FormData();
                for (const f of fs) fd.append("files", f);
                st.textContent = "Embedding...";
                const r = await fetch("/api/upload", {
                    method: "POST",
                    body: fd,
                });
                st.textContent = r.ok
                    ? "Done: " + JSON.stringify((await r.json()).chunks_added)
                    : "Upload failed";
            };

            loadHistory();
        </script>
    </body>
</html>
